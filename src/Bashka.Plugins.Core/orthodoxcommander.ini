[OrthodoxCommander]
AltCharActivatesSearch = true

; command = key combinations separated by comma, see Avalonia.Input.Key
[OrthodoxCommander(keys)]
QuickSearchCommand = CTRL+F
ToggleMarkCommand = INSERT, SHIFT+DOWN
ToggleMarkUpCommand = SHIFT+UP
MarkAllCommand = ADD
UnmarkAllCommand = SUBTRACT
InvertMarksCommand = MULTIPLY

F1SlotCommand = F1
CtrlF1SlotCommand = CTRL+F1
